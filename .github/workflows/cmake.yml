# CANgaroo-jl is a Windows-only CAN/CAN-FD analyzer for candleLight (gs_usb)
# adapter development. CI therefore builds and tests on Windows only: the
# MSYS2/UCRT64 job creates the release archive, and a version tag publishes it.
on:
  workflow_dispatch:  # enables manual trigger
  push:
    branches: [ "main", "master" ]
    # A version tag (V0.7.2, as the existing tags, or v0.7.2) also publishes a
    # draft release with the Windows zip, see "release" below.
    tags: [ "V*", "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Build and test CANgaroo (Windows / MinGW / Qt6)
    runs-on: windows-2022
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSYS2 with MinGW + Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-qt6
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-ntldd
            git

      - name: Verify Qt6 installation
        run: |
          qmake6 --version
          which qmake6

      - name: Configure build (Qt6 qmake)
        run: |
          qmake6 CONFIG+=release

      - name: Build
        run: |
          mingw32-make -j$(nproc)

      # "make check" uses qmake's testcase wrapper, whose shell script does not
      # run under cmd; the binaries themselves are plain QtTest executables.
      - name: Configure and build unit tests
        run: |
          cd tests
          qmake6
          mingw32-make -j$(nproc)

      - name: Run unit tests
        run: |
          cd build/tests
          status=0
          for test in *_test.exe; do
            echo "==== $test ===="
            ./"$test" -silent || status=1
          done
          exit $status

      - name: List build output
        run: |
          echo "==== Project root ===="
          ls -lah

          echo "==== Executables ===="
          find . -maxdepth 2 -name "*.exe" -type f -print

      - name: Prepare distribution directory
        run: |
          mkdir -p dist
          cp ./bin/*.exe dist/

      - name: Deploy Qt6 runtime (windeployqt)
        run: |
          EXE=$(ls dist/*.exe | head -n 1)
          windeployqt6 \
            --release \
            --no-system-d3d-compiler \
            "$EXE"

      - name: Add MinGW runtime DLLs
        run: |
          cp /ucrt64/bin/libgcc_s_seh-1.dll dist/
          cp /ucrt64/bin/libstdc++-6.dll dist/
          cp /ucrt64/bin/libwinpthread-1.dll dist/
          cp /ucrt64/bin/libmd4c.dll dist/
          cp /ucrt64/bin/libharfbuzz-0.dll dist/
          cp /ucrt64/bin/libfreetype-6.dll dist/
          cp /ucrt64/bin/libpng16-16.dll dist/
          cp /ucrt64/bin/zlib1.dll dist/
          cp /ucrt64/bin/libdouble-conversion.dll dist/
          cp /ucrt64/bin/libb2-1.dll dist/
          cp /ucrt64/bin/libicuin78.dll dist/
          cp /ucrt64/bin/libbrotlidec.dll dist/
          cp /ucrt64/bin/libzstd.dll dist/
          cp /ucrt64/bin/libicuuc78.dll dist/
          cp /ucrt64/bin/libpcre2-16-0.dll dist/

      - name: Deploy MinGW runtime dependencies
        run: |
          EXE=$(ls dist/*.exe | head -n 1)

          echo "Resolving UCRT64 runtime dependencies for $EXE"

          ntldd -R "$EXE" \
            | grep ucrt64 \
            | awk '{print $3}' \
            | sort -u \
            | while IFS= read -r file; do
              # Convert Windows path to Linux path
              linux_path=$(echo "$file" | sed -E 's|([A-Za-z]):\\|/\L\1/|; s|\\|/|g')

              echo "Copying $linux_path"
              cp "$linux_path" dist/ || echo "Skipped $linux_path"
              done

      - name: Verify missing DLLs
        run: |
          EXE=$(ls dist/*.exe | head -n 1)
          ntldd "$EXE" || true

      - name: Zip
        shell: pwsh
        run: |
          # named after the program version (VERSION in src/src.pro)
          $version = (Select-String -Path src/src.pro -Pattern '^VERSION\s*=\s*(\S+)').Matches[0].Groups[1].Value
          $name = "CANgaroo-$version-windows-x64"
          Move-Item dist $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      # upload the zip as it is: zipped again by upload-artifact, the download
      # would be a zip inside a zip
      - name: Upload Windows Qt6 binaries
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: "CANgaroo-*-windows-x64.zip"
          archive: false
          if-no-files-found: error

  release:
    name: Release (tags only)
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/V') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The package is named after VERSION in src/src.pro: a tag that does not
      # match it would publish a file with another version than the release
      - name: Check tag against src/src.pro
        run: |
          VERSION=$(grep '^VERSION' src/src.pro | sed 's/VERSION\s*=\s*//')
          TAG="${GITHUB_REF_NAME#[Vv]}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION = ${VERSION} in src/src.pro"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-windows.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true
          skip-decompress: true     # the Windows zip stays a zip (it would be unpacked into a folder, which the upload skips)

      - name: Show files
        run: ls -alR artifacts

      - uses: softprops/action-gh-release@v3
        with:
          name: CANgaroo ${{ github.ref_name }}
          draft: true
          files: artifacts/*
